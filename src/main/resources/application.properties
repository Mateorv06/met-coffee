spring.application.name=met-coffee

# URI de conexión a MongoDB (local o MongoDB Atlas).
# Se lee de la variable de entorno MONGODB_URI; si no existe usa MongoDB local.
# Ejemplo Atlas: mongodb+srv://<usuario>:<clave>@<cluster>.mongodb.net/metcoffee?appName=Cluster0
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27018/metcoffee?replicaSet=rs0}

# Subida de imágenes de producto (máx. 5 MB, igual que ProductoService.IMAGEN_MAX_BYTES)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Cambiar JWT_SECRET en cualquier entorno compartido o de produccion.
app.jwt.secret=${JWT_SECRET:met-coffee-local-secret-change-before-sharing-2026}
app.jwt.expiration=${JWT_EXPIRATION:PT30M}
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.web.resources.static-locations=classpath:/static/,file:${app.upload-dir}/
